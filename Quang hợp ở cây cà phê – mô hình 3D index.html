<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quang hợp ở cây cà phê – mô hình 3D</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
body{font-family:"Segoe UI",system-ui,sans-serif;background:linear-gradient(#cfe3f5,#f2f7fd);overflow:hidden;color:#1b2733}
canvas{display:block;position:fixed;inset:0;touch-action:none}
.card{background:rgba(255,255,255,.94);border:1px solid #dbe3ec;border-radius:14px;box-shadow:0 2px 10px rgba(30,60,90,.12)}
#panel{position:fixed;left:12px;top:12px;width:min(370px,calc(100% - 24px));padding:14px 16px;max-height:55vh;overflow:auto;z-index:5}
#panel h1{font-size:18px;margin:0 0 4px}
#panel .eq{font-weight:600;font-size:14px;margin:0 0 8px}
.row{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:14px}
.row input{width:16px;height:16px}
.dot{width:13px;height:13px;border-radius:50%;flex:none}
.row span.t{cursor:pointer}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 8px}
button{font:inherit;font-size:14px;padding:7px 14px;border:1px solid #c9d3de;border-radius:9px;background:#fff;cursor:pointer}
button:focus-visible{outline:2px solid #1b6fd1;outline-offset:2px}
.hint{font-size:12px;color:#5b6a79;line-height:1.5;margin:0}
#enter{position:fixed;right:12px;top:12px;z-index:5}
.lb{position:fixed;left:0;top:0;z-index:3;padding:2px 9px;font-size:12px;border-radius:12px;background:rgba(255,255,255,.88);border:1px solid #dbe3ec;white-space:nowrap;transform:translate(-50%,-50%)}
#info{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:min(560px,calc(100% - 24px));padding:14px 18px;z-index:6;display:none;max-height:42vh;overflow:auto}
#info h2{font-size:17px;margin:0 28px 6px 0}
#info ul{margin:0;padding-left:20px;font-size:14px;line-height:1.55}
#x{position:absolute;right:10px;top:10px;padding:2px 9px}
</style></head><body>
<div id="panel" class="card">
 <h1>Quang hợp ở cây cà phê</h1>
 <p class="eq">6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂</p>
 <div id="legend"></div>
 <div class="btns"><button id="pause">Tạm dừng</button><button id="reset">Đặt lại góc nhìn</button><button id="seeroot">Xem rễ</button><button id="seestem">Xem thân</button><button id="spin">Tự xoay: bật</button></div>
 <p class="hint">Kéo để xoay. Chuột phải hoặc Shift + kéo để di chuyển. Cuộn hoặc chụm để phóng to. Nhấn vào bộ phận, nhãn hoặc tên chất để xem giải thích.</p>
</div>
<button id="enter">Vào lục lạp</button>
<div id="info" class="card"><button id="x" aria-label="Đóng">✕</button><h2></h2><ul></ul></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const INFO={
sun:["Ánh sáng mặt trời",["Nguồn năng lượng cho quang hợp.","Diệp lục hấp thụ mạnh ánh sáng đỏ và xanh tím, hấp thụ ít ánh sáng xanh lục nên lá có màu xanh.","Cường độ và màu sắc ánh sáng ảnh hưởng đến cường độ quang hợp."]],
leaf:["Lá – cơ quan quang hợp",["Phiến lá mỏng, diện tích lớn để nhận nhiều ánh sáng.","Mô giậu chứa nhiều lục lạp, là nơi quang hợp chính.","Gân lá chứa mạch gỗ (đưa nước đến) và mạch rây (đưa glucose đi).","Mặt dưới có nhiều khí khổng để trao đổi khí."]],
stem:["Thân – đường vận chuyển",["Mạch gỗ vận chuyển nước và muối khoáng từ rễ lên lá.","Mạch rây vận chuyển sản phẩm quang hợp (saccarôzơ, glucose) từ lá xuống các cơ quan.","Hạt xanh dương và hồng tím đi lên trong mạch gỗ, hạt cam đi xuống trong mạch rây."]],
roots:["Rễ – hút nước và muối khoáng",["Lông hút ở đầu rễ hấp thụ nước và ion khoáng từ đất.","Nước và ion khoáng đi từ lông hút qua vỏ rễ, vào mạch gỗ rồi theo thân lên lá.","Ở vỏ rễ có hai con đường: qua thành tế bào và khoảng gian bào, hoặc qua chất nguyên sinh. Đai Caspari ở nội bì buộc dòng nước đi qua tế bào nội bì trước khi vào mạch gỗ.","Nước vào nhờ chênh lệch áp suất thẩm thấu. Ion khoáng vào chủ động (tốn ATP) hoặc thụ động.","Nước đi lên nhờ lực hút do thoát hơi nước ở lá, lực đẩy của rễ và lực liên kết giữa các phân tử nước.","Cà phê có rễ cọc ăn sâu và nhiều rễ bên."]],
soil:["Đất",["Chứa nước và muối khoáng (N, P, K, Mg…) cho cây.","Magiê là thành phần của diệp lục.","Carbon trong chất hữu cơ đến từ CO₂ trong không khí, không phải từ đất."]],
stomata:["Khí khổng",["CO₂ khuếch tán từ không khí vào lá qua khí khổng.","O₂ và hơi nước thoát ra ngoài qua khí khổng.","Hai tế bào hạt đậu điều chỉnh độ mở: thường mở ban ngày, đóng khi thiếu nước."]],
chloroplast:["Lục lạp – nơi quang hợp diễn ra",["Bào quan có màng kép, chứa diệp lục và các enzim quang hợp.","Grana (các chồng tilacôit): diễn ra pha sáng.","Chất nền (stroma): diễn ra pha tối, tức chu trình Calvin.","Vào: ánh sáng, H₂O, CO₂. Ra: O₂ và glucose."]],
grana:["Grana – pha sáng",["Màng tilacôit chứa hệ sắc tố và chuỗi vận chuyển electron.","Quang phân li nước: 2H₂O → 4H⁺ + 4e⁻ + O₂ (O₂ thải ra ngoài).","Tạo ra ATP và NADPH để đưa sang pha tối."]],
calvin:["Chu trình Calvin – pha tối (ở stroma)",["Giai đoạn 1, cố định CO₂: CO₂ + RuDP (5C) nhờ enzim RuBisCO tạo 2 APG (3C).","Giai đoạn 2, khử: APG được khử thành AlPG nhờ ATP và NADPH.","Giai đoạn 3, tái sinh: phần lớn AlPG tái tạo RuDP.","Phần AlPG còn lại tạo glucose, tinh bột, saccarôzơ. Cà phê là thực vật C3."]],
rudp:["RuDP (5C)",["Chất nhận CO₂ đầu tiên của chu trình.","Enzim RuBisCO gắn CO₂ vào RuDP.","Được tái sinh ở cuối chu trình."]],
pga:["APG (3C) – axit photphoglixeric",["Sản phẩm ổn định đầu tiên của cố định CO₂.","Bị khử bằng ATP và NADPH để thành AlPG."]],
alpg:["AlPG (3C) – anđehit photphoglixeric",["Phần lớn dùng để tái sinh RuDP.","Một phần tạo glucose, tinh bột, saccarôzơ và các chất hữu cơ khác.","Cần 6 vòng chu trình để tạo 1 glucose."]],
light:["Ánh sáng",["Cung cấp năng lượng để quang phân li nước và tạo ATP, NADPH ở pha sáng."]],
xylem:["Mạch gỗ (xilem)",["Vận chuyển nước và ion khoáng từ rễ lên lá.","Dòng đi một chiều từ dưới lên, qua các tế bào chết (quản bào, mạch ống) nối thành ống rỗng.","Động lực: lực hút do thoát hơi nước ở lá, lực đẩy của rễ, lực liên kết giữa các phân tử nước và bám vào thành mạch."]],phloem:["Mạch rây (floem)",["Vận chuyển sacarôzơ và các chất hữu cơ từ lá (nơi tạo ra) đến rễ, hoa, quả và nơi dự trữ.","Đi qua các tế bào sống (ống rây và tế bào kèm), chủ yếu từ lá xuống.","Glucose thường được chuyển thành sacarôzơ rồi mới vận chuyển."]],min:["Muối khoáng",["Rễ hấp thụ ion khoáng (N, P, K, Mg…) từ dung dịch đất.","Đi cùng dòng nước trong mạch gỗ lên lá.","Cây dùng để tạo diệp lục, enzim và nhiều hợp chất khác."]],hair:["Lông hút",["Tế bào biểu bì rễ kéo dài, làm tăng mạnh diện tích tiếp xúc với đất.","Có không bào lớn, áp suất thẩm thấu cao nên hút được nước và ion khoáng.","Từ đây nước và khoáng đi vào vỏ rễ, nội bì rồi vào mạch gỗ."]],h2o:["H₂O",["Rễ hút từ đất qua lông hút, đi theo các nhánh rễ về rễ chính rồi theo mạch gỗ lên lá.","Ở pha sáng, nước bị quang phân li, cung cấp electron, H⁺ và giải phóng O₂."]],
co2:["CO₂",["Vào lá qua khí khổng.","Được cố định ở chu trình Calvin để tạo chất hữu cơ."]],
o2:["O₂",["Sinh ra từ quang phân li nước ở pha sáng.","Thoát ra không khí qua khí khổng."]],
glu:["Glucose C₆H₁₂O₆",["Sản phẩm của quang hợp, tạo từ AlPG.","Được chuyển xuống nuôi cây, hoặc dự trữ dưới dạng tinh bột."]]};
const T=THREE,R=new T.WebGLRenderer({antialias:true,alpha:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));document.body.appendChild(R.domElement);
const S=new T.Scene(),C=new T.PerspectiveCamera(45,1,.1,200);
S.add(new T.AmbientLight(0xffffff,.85));const dl=new T.DirectionalLight(0xffffff,.6);dl.position.set(5,10,8);S.add(dl);
const hit=[],V=(x,y,z)=>new T.Vector3(x,y,z),rn=(a,b)=>a+Math.random()*(b-a);
function mk(g,c,key,o){const m=new T.Mesh(g,new T.MeshStandardMaterial(Object.assign({color:c,roughness:.6},o||{})));m.userData.key=key;hit.push(m);return m}
const sun=mk(new T.SphereGeometry(1.2,32,24),0xffd966,'sun',{emissive:0xffc833,emissiveIntensity:.6});sun.position.set(0,10.5,0);S.add(sun);
const glow=new T.Mesh(new T.SphereGeometry(2.3,32,24),new T.MeshBasicMaterial({color:0xfff3c0,transparent:true,opacity:.3}));glow.position.copy(sun.position);S.add(glow);
const pot=mk(new T.CylinderGeometry(3.2,2,2.4,48,1,true),0xd9c3ad,'soil',{transparent:true,opacity:.22,side:T.DoubleSide});pot.position.y=-1.2;S.add(pot);
const grass=mk(new T.CylinderGeometry(3.2,3.2,.12,48),0x8cff7a,'soil');grass.position.y=-.06;S.add(grass);
const rootPts=[];
const hair=[];
const rpaths=[];
function br(p,d,len,rad,dep,ch){ch=ch||[];const pts=[p.clone()];let q=p.clone();
 for(let k=1;k<=4;k++){q=q.clone().add(d.clone().multiplyScalar(len/4)).add(V(rn(-.08,.08),rn(-.05,.02),rn(-.08,.08)));
  if(q.y<-2.2)q.y=-2.2;const h=Math.hypot(q.x,q.z);if(h>2.4){q.x*=2.4/h;q.z*=2.4/h}pts.push(q.clone())}
 const cv=new T.CatmullRomCurve3(pts);S.add(mk(new T.TubeGeometry(cv,12,rad,5),dep>1?0xeec45a:0xd9962c,'roots'));
 const full=ch.concat(pts);if(dep===0)rootPts.push(pts[4]);if(dep>=2)rpaths.push(full);
 if(dep<3){const n=dep===0?3:2;for(let j=0;j<n;j++){const b=rn(0,6.28),s=rn(.4,.9),pp=cv.getPoint(rn(.3,.9));
   br(pp,V(Math.cos(b)*s,-rn(.2,.7),Math.sin(b)*s).normalize(),len*.55,rad*.6,dep+1,full)}}
 else for(let j=0;j<6;j++){const pp=cv.getPoint(rn(.2,1)),b=rn(0,6.28);hair.push(pp,pp.clone().add(V(Math.cos(b)*.12,-rn(0,.1),Math.sin(b)*.12)))}}
for(let i=0;i<12;i++){const a=i*2.4+rn(-.2,.2);br(V(0,-.1,0),V(Math.cos(a)*.8,-.6,Math.sin(a)*.8).normalize(),rn(1.3,1.9),.06,0)}
br(V(0,-.1,0),V(0,-1,0),1.9,.09,1);
S.add(new T.LineSegments(new T.BufferGeometry().setFromPoints(hair),new T.LineBasicMaterial({color:0xf5dfa0})));
const stem=mk(new T.CylinderGeometry(.07,.12,6.4,12),0x8b5a2b,'stem',{transparent:true,opacity:.4});stem.position.y=3.2;S.add(stem);
[['xylem',0x2f8cff,-.035],['phloem',0xff9f1a,.035]].forEach(v=>{const m=mk(new T.CylinderGeometry(.022,.022,6.3,8),v[1],v[0],{emissive:v[1],emissiveIntensity:.4});m.position.set(v[2],3.2,0);S.add(m)});
const lc=document.createElement('canvas');lc.width=256;lc.height=128;const lx=lc.getContext('2d');
const lgr=lx.createLinearGradient(0,0,256,0);lgr.addColorStop(0,'#2c8f3f');lgr.addColorStop(1,'#1d6b2f');lx.fillStyle=lgr;lx.fillRect(0,0,256,128);
lx.strokeStyle='rgba(190,230,140,.8)';lx.lineWidth=3;lx.beginPath();lx.moveTo(0,64);lx.lineTo(256,64);lx.stroke();
lx.lineWidth=1.2;lx.strokeStyle='rgba(170,220,130,.5)';
for(let i=1;i<10;i++){const x=i*24;lx.beginPath();lx.moveTo(x,64);lx.lineTo(x+40,6);lx.moveTo(x,64);lx.lineTo(x+40,122);lx.stroke()}
const leafTex=new T.CanvasTexture(lc),leafGeo=new T.PlaneGeometry(1,1,18,8);
(()=>{const P=leafGeo.attributes.position;for(let i=0;i<P.count;i++){const u=P.getX(i)+.5,v=P.getY(i)*2,w=.19*Math.pow(Math.sin(Math.PI*Math.pow(u,.8)),.7),z=v*w;
 P.setXYZ(i,u,Math.abs(z)*.25-u*u*.12+Math.sin(u*12+z*10)*.012*Math.abs(v),z)}leafGeo.computeVertexNormals()})();
const leafPts=[],stoPts=[];
for(let i=0;i<12;i++){const y=1.4+i*.4,s=1.05-i*.04,pv=new T.Group();pv.position.y=y;pv.rotation.y=i*2.4;pv.rotation.z=.22;S.add(pv);
 const lf=mk(leafGeo,0xffffff,'leaf',{map:leafTex,side:T.DoubleSide,roughness:.35});lf.material.color.setScalar(rn(.8,1));lf.scale.setScalar(2.6*s);lf.position.x=.05;pv.add(lf);
 const st=mk(new T.CylinderGeometry(.13,.13,.03,14),0x0d3b1e,'stomata');st.position.set(1.4*s,-.07,.12);pv.add(st);
 pv.updateMatrixWorld(true);leafPts.push(lf.localToWorld(V(.5,-.02,0)));stoPts.push(st.getWorldPosition(V(0,0,0)))}
const CP=V(-7.5,3,0),KP=V(7.5,3,0);
const cl=new T.Group();cl.position.copy(CP);S.add(cl);
const env=mk(new T.SphereGeometry(1.9,32,24),0x7be08a,'chloroplast',{transparent:true,opacity:.35});env.scale.set(1.35,1,1);cl.add(env);
[[-1.1,.6],[.2,.9],[.9,-.5],[-.4,-.6]].forEach(p=>{for(let k=0;k<5;k++){const d=mk(new T.CylinderGeometry(.5,.5,.1,20),0x1fc43a,'grana');d.position.set(p[0],-.5+k*.2-.3,p[1]);cl.add(d)}});
const kv=new T.Group();kv.position.copy(KP);S.add(kv);
kv.add(mk(new T.TorusGeometry(1.8,.06,8,64),0xb7bcc4,'calvin'));
const nodeDef=[['rudp',0xb05cf0,90],['pga',0x16c2a0,-30],['alpg',0xfb9a1c,210]],nodePos={};
nodeDef.forEach(n=>{const a=n[2]*Math.PI/180,m=mk(new T.SphereGeometry(.28,20,16),n[1],n[0]);m.position.set(Math.cos(a)*1.8,Math.sin(a)*1.8,0);kv.add(m);nodePos[n[0]]=m.position.clone().add(KP)});
const mover=new T.Mesh(new T.SphereGeometry(.12,12,8),new T.MeshBasicMaterial({color:0xffffff}));kv.add(mover);
function dash(a,b){const g=new T.BufferGeometry().setFromPoints([a,b]),l=new T.Line(g,new T.LineDashedMaterial({color:0x5b6a79,dashSize:.25,gapSize:.15}));l.computeLineDistances();S.add(l)}
dash(leafPts[6],V(-5.7,3,0));dash(V(-5.1,3,0),V(5.7,3,0));
const GR={};
const dc=document.createElement('canvas');dc.width=dc.height=64;const dx=dc.getContext('2d');dx.beginPath();dx.arc(32,32,30,0,6.283);dx.fillStyle='#fff';dx.fill();const dot=new T.CanvasTexture(dc);
function mkP(name,col,n,size,path){const g=new T.BufferGeometry(),pos=new Float32Array(n*3);g.setAttribute('position',new T.BufferAttribute(pos,3));
 const p=new T.Points(g,new T.PointsMaterial({color:col,size,map:dot,transparent:true,alphaTest:.5,sizeAttenuation:true}));p.frustumCulled=false;if(name==='h2o'||name==='min'||name==='glu'){p.material.depthTest=false;p.renderOrder=5}S.add(p);
 const st=[];for(let i=0;i<n;i++)st.push({t:Math.random(),s:rn(.08,.18),pts:path()});GR[name]={p,st,pos,fn:path}}
const pick=a=>a[Math.floor(Math.random()*a.length)].clone();
const air=()=>{const a=rn(0,6.28),r=rn(3,6.5);return V(Math.cos(a)*r,rn(.5,8),Math.sin(a)*r)};
mkP('light',0xffd23f,90,.14,()=>[V(rn(-.9,.9),10,rn(-.9,.9)),pick(leafPts).add(V(0,.3,0))]);
const up=()=>{const rp=rpaths[Math.floor(Math.random()*rpaths.length)],l=pick(leafPts);return rp.slice().reverse().map(v=>v.clone()).concat([V(-.035,-.1,0),V(-.035,l.y,0),l])};
mkP('h2o',0x2f8cff,90,.3,up);
mkP('min',0xe056c1,45,.26,up);
mkP('co2',0x8a8f98,70,.19,()=>[air(),pick(stoPts)]);
mkP('o2',0xff4d5a,70,.19,()=>[pick(stoPts),air()]);
mkP('glu',0xff9f1a,30,.24,()=>{const l=pick(leafPts);return[l,V(.035,l.y,0),V(.035,-.1,0),pick(rootPts)]});
function at(p,t){const n=p.length-1,f=Math.min(t,.9999)*n,i=Math.floor(f);return p[i].clone().lerp(p[i+1],f-i)}
const LEG=[['light','#ffcf3f','Ánh sáng mặt trời chiếu vào lá'],['h2o','#2f8cff','H₂O: rễ hút, theo thân lên lá'],['min','#e056c1','Muối khoáng: rễ hút, đi lên lá'],['co2','#8a8f98','CO₂: vào lá qua khí khổng'],['o2','#ff4d5a','O₂: thải ra không khí'],['glu','#ff9f1a','Glucose C₆H₁₂O₆: chuyển xuống nuôi cây']];
const lg=document.getElementById('legend');
LEG.forEach(l=>{const r=document.createElement('div');r.className='row';
 r.innerHTML=`<input type="checkbox" checked aria-label="${l[2]}"><span class="dot" style="background:${l[1]}"></span><span class="t">${l[2]}</span>`;
 r.querySelector('input').onchange=e=>{GR[l[0]].p.visible=e.target.checked};
 r.querySelector('.t').onclick=()=>show(l[0]);lg.appendChild(r)});
const labels=[];
function lab(txt,key,fn){const b=document.createElement('button');b.className='lb';b.textContent=txt;b.onclick=()=>show(key);document.body.appendChild(b);labels.push([b,fn])}
lab('Mặt trời','sun',()=>sun.position.clone().add(V(2.6,0,0)));lab('Lá','leaf',()=>leafPts[3].clone().add(V(0,.4,0)));
lab('Khí khổng','stomata',()=>stoPts[6].clone().add(V(0,-.5,0)));lab('Thân','stem',()=>V(.5,.9,0));lab('Rễ','roots',()=>V(1.2,-1.8,1.5));
lab('Đất','soil',()=>V(-2.4,-.4,2.2));lab('Mạch gỗ','xylem',()=>V(-.6,3.5,0));lab('Mạch rây','phloem',()=>V(.6,2.7,0));lab('Lông hút','hair',()=>rpaths[0][rpaths[0].length-1].clone().add(V(0,-.3,0)));lab('Lục lạp','chloroplast',()=>CP.clone().add(V(0,-2.2,0)));
lab('Chu trình Calvin','calvin',()=>KP.clone().add(V(0,2.5,0)));lab('RuDP (5C)','rudp',()=>nodePos.rudp.clone().add(V(0,.6,0)));
lab('APG (3C)','pga',()=>nodePos.pga.clone().add(V(.3,-.6,0)));lab('AlPG (3C)','alpg',()=>nodePos.alpg.clone().add(V(-.3,-.6,0)));
const info=document.getElementById('info');
function show(k){const d=INFO[k];if(!d)return;info.querySelector('h2').textContent=d[0];info.querySelector('ul').innerHTML=d[1].map(x=>`<li>${x}</li>`).join('');info.style.display='block';
 if(k==='chloroplast'||k==='grana')go(CP,9);else if(k==='calvin'||nodePos[k])go(KP,9)}
document.getElementById('x').onclick=()=>info.style.display='none';
const home={tgt:V(0,3.5,0),dist:24};
let tgt=home.tgt.clone(),wt=tgt.clone(),dist=home.dist,wd=dist,az=0,pol=1.3,paused=false;
function go(t,d){wt=t.clone();wd=d}
document.getElementById('enter').onclick=()=>{go(CP,9);az=0;show('chloroplast')};
document.getElementById('reset').onclick=()=>{go(home.tgt,home.dist);az=0;pol=1.3};
document.getElementById('seeroot').onclick=()=>{go(V(0,-1,0),7);az=.4;pol=1.55;show('roots')};
document.getElementById('seestem').onclick=()=>{go(V(0,3.2,0),4.5);az=.3;pol=1.5;show('stem')};
let spin=true;const sb=document.getElementById('spin');sb.onclick=()=>{spin=!spin;sb.textContent=spin?'Tự xoay: bật':'Tự xoay: tắt'};
const pb=document.getElementById('pause');pb.onclick=()=>{paused=!paused;pb.textContent=paused?'Tiếp tục':'Tạm dừng'};
const cv=R.domElement,ptr=new Map();let down=null,pd=0;
cv.oncontextmenu=e=>e.preventDefault();
cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,[e.clientX,e.clientY]);down=[e.clientX,e.clientY];if(ptr.size===2)pd=pinch()};
function pinch(){const a=[...ptr.values()];return Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1])}
cv.onpointermove=e=>{if(!ptr.has(e.pointerId))return;const o=ptr.get(e.pointerId),dx=e.clientX-o[0],dy=e.clientY-o[1];ptr.set(e.pointerId,[e.clientX,e.clientY]);
 if(ptr.size===2){const p=pinch();wd=Math.min(45,Math.max(4,wd*pd/p));pd=p;return}
 if(e.buttons===2||e.shiftKey){const r=V(1,0,0).applyQuaternion(C.quaternion),u=V(0,1,0).applyQuaternion(C.quaternion),k=dist*.0016;wt.addScaledVector(r,-dx*k).addScaledVector(u,dy*k)}
 else{az-=dx*.006;pol=Math.min(2.2,Math.max(.3,pol-dy*.006))}};
cv.onpointerup=e=>{ptr.delete(e.pointerId);if(down&&Math.hypot(e.clientX-down[0],e.clientY-down[1])<5&&!ptr.size){
 const rc=new T.Raycaster(),q=V(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1,0);rc.setFromCamera(q,C);
 const h=rc.intersectObjects(hit,false);if(h.length){const f=h.find(x=>x.object.userData.key!=='soil')||h[0];show(f.object.userData.key)}}down=null};
cv.onwheel=e=>{e.preventDefault();wd=Math.min(45,Math.max(4,wd*Math.exp(e.deltaY*.001)))};
addEventListener('keydown',e=>{const k=e.key.toLowerCase(),s=dist*.03;
 if(k==='arrowleft'||k==='a')wt.x-=s;if(k==='arrowright'||k==='d')wt.x+=s;if(k==='arrowup'||k==='w')wt.y+=s;if(k==='arrowdown'||k==='s')wt.y-=s});
function size(){R.setSize(innerWidth,innerHeight);C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix()}
addEventListener('resize',size);size();
const clk=new T.Clock();let ang=0;
(function loop(){requestAnimationFrame(loop);const dt=Math.min(clk.getDelta(),.05);
 if(!paused){for(const k in GR){const g=GR[k];g.st.forEach((q,i)=>{q.t+=q.s*dt;if(q.t>1){q.t=0;q.pts=g.fn()}const v=at(q.pts,q.t);g.pos[i*3]=v.x;g.pos[i*3+1]=v.y;g.pos[i*3+2]=v.z});g.p.geometry.attributes.position.needsUpdate=true}
  ang+=dt*1.2;mover.position.set(Math.cos(ang)*1.8,Math.sin(ang)*1.8,0);glow.scale.setScalar(1+Math.sin(clk.elapsedTime*2)*.04)}
 if(spin&&!ptr.size)az+=dt*.2;tgt.lerp(wt,.08);dist+=(wd-dist)*.08;
 C.position.set(tgt.x+dist*Math.sin(pol)*Math.sin(az),tgt.y+dist*Math.cos(pol),tgt.z+dist*Math.sin(pol)*Math.cos(az));C.lookAt(tgt);
 labels.forEach(([b,f])=>{const v=f().project(C);if(v.z>1){b.style.display='none';return}b.style.display='';b.style.left=((v.x+1)/2*innerWidth)+'px';b.style.top=((1-v.y)/2*innerHeight)+'px'});
 R.render(S,C)})();
</script></body></html>
